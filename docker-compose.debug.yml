services:
  fmp-llm-service-debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
    container_name: fmp-llm-service-debug
    restart: "no"
    ports:
      - "8003:8003"
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - ./dl_models:/app/dl_models
      - ./config/firebase-credentials.json:/app/config/firebase-credentials.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=fmp-redis
      - REDIS_PORT=6379
    networks:
      - fmp-network

networks:
  fmp-network:
    external: true
